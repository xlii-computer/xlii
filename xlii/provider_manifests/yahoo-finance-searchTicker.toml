name = "yahoo-finance-searchTicker"
version = 1
summary = "Stock quotes, OHLCV charts, ticker search — unofficial, no API key needed (argus: yahoo-finance.searchTicker)"
category = "finance"
required_params = ["query"]

[request]
method = "GET"
url = "https://query1.finance.yahoo.com/v1/finance/search"

[request.params]
q = "{query}"
quotesCount = "10"
newsCount = "0"

[quota]
daily = 2000

[shape]
records = "quotes"

[shape.fields]
symbol = "symbol"
name = "shortname"
type = "quoteType"
exchange = "exchDisp"
