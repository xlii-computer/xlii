name = "sec-edgar"
version = 1
summary = "SEC filings — 10-K, 10-Q, 8-K, insider trades — cik = 10-digit zero-padded CIK (argus: sec-edgar.query)"
category = "finance"
required_params = ["cik"]

[request]
method = "GET"
url = "https://data.sec.gov/submissions/CIK{cik}.json"

[auth]
kind = "header"
key_env = "SEC_EDGAR_USER_AGENT"
header = "User-Agent"
required = true

[shape]
records = ""
