name = "samgov-entities"
version = 1
summary = "SAM.gov entity search — registered US federal contractors/awardees (argus: samgov, hand-authored cohort 2)"
category = "compliance"
required_params = ["query"]

[request]
method = "GET"
url = "https://api.sam.gov/entity-information/v3/entities"

[request.params]
legalBusinessName = "{query}"
registrationStatus = "A"
includeSections = "entityRegistration,coreData"

[auth]
kind = "query"
key_env = "SAMGOV_API_KEY"
param = "api_key"
required = true

[quota]
daily = 1000

[shape]
records = "entityData"

[shape.fields]
name = "entityRegistration.legalBusinessName"
uei = "entityRegistration.ueiSAM"
cage = "entityRegistration.cageCode"
status = "entityRegistration.registrationStatus"
state = "coreData.physicalAddress.stateOrProvinceCode"
country = "coreData.physicalAddress.countryCode"
