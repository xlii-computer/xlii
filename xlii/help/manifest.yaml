# Help corpus manifest — source of truth for /howto + /describe routing.
#
# Tiers:
#   core      → bundled into xlii/help/ by scripts/bundle_help.py (offline).
#   extended  → GitHub-sourced + etag-cached (~/.cache/xlii/help), always current.
# Help bar: every topic (except index) needs menu: (≤22 chars) and
# group: start|work|more. check_docs fails a missing pair so a new
# shard cannot blow the dropdown off-screen.
# Per-command docs (commands/*.md) power /describe fusion: live registry facts
# from code + this expansive prose from GitHub. see_also wires the graph.
# Remote fetch: raw.githubusercontent.com/{repo}/{ref}/{base_path}/...
# Override the ref with the XLII_HELP_REF env var.

version: 2
repo: xlii-computer/xlii
ref: main
base_path: docs/help

topics:
  # --- core tier (bundled, offline-complete) ---
  index:
    title: Help topic index
    path: topics/index.md
    tier: core
    aliases: [topics, list]

  install:
    title: Install & first-time setup
    menu: Install
    group: start
    path: topics/install.md
    tier: core
    aliases: [setup, bootstrap]
    tags: [install, keys, doctor, setup]
    see_also: [config-models, first-session, troubleshoot]

  first-session:
