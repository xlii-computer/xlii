name = "redeploy"
description = "Clean redeploy: publish + prune remote-only files (params: name, domain, src, conn, root)"

[params.name]
required = true
help = "app label — the subdomain to redeploy"

[params.domain]
required = true
help = "apps domain the box serves (e.g. example.com)"

[params.src]
default = "."
help = "local directory to publish"

[params.conn]
default = "appbox"
help = "remote connection name (xlii remote add)"

[params.root]
default = "srv/apps"
help = "docroot base on the box, relative to the SSH login home"

[[step]]
run = "xlii remote publish {{src}} sftp://{{conn}}/{{root}}/{{name}}.{{domain}} --delete"
