name: test

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,tui]"
      - name: Ruff
        run: ruff check xlii/ tests/
      - name: Import contract (faces import kernel, never the reverse)
        run: lint-imports
      - name: Contract greps (Path.home / isatty / keyring ratchets)
        run: python scripts/check_contracts.py
      - name: Pytest
        run: pytest -q --cov=xlii --cov-report=xml
      - name: Upload coverage to Code Quality
        uses: actions/upload-code-coverage@82c7aee3fb2ad768e00b00a0a8d749c5815085b6 # v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          fail-on-error: false
      - name: Docs truth check
        run: python scripts/check_docs.py
      - name: Plugin lint (stock pack)
        run: xlii plugin --lint
        env:
          XLII_CONFIG_DIR: /tmp/xlii-ci-config

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: REPL smoke (offline, fake key)
        run: bash scripts/smoke_repl.sh
      - name: Daemon-gate smoke (offline, no [daemon] extra)
        run: bash scripts/smoke_daemon.sh
