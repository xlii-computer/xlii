[package]
name = "xlii-desktop"
version = "0.1.0"
description = "The xlii desktop face — logic-free Tauri host over xlii serve --face"
edition = "2021"

# Security: glib >= 0.20 (GHSA-wrw7-89jp-8q8g / Dependabot alert #3) is blocked by the
# published Tauri 2 Linux stack (gtk 0.18 → glib ^0.18). Track upstream GTK4 migration:
# https://github.com/tauri-apps/tauri/issues/12563 and https://github.com/tauri-apps/tauri/pull/14684

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
strip = true
lto = true
