[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlii"
dynamic = ["version"]  # single source: xlii/__init__.py __version__ — stamped by scripts/stamp_version.py (date + green-test count; a red suite refuses to stamp)
description = "Personal AI substrate — Grok + xAI Collections, user-curated personas/docs/plugins, multi-key swarm. The Emacs of AI tooling (xlii = 42)."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "xlii", email = "hello@xlii.computer"},
]
keywords = ["ai", "agent", "xai", "grok", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
  "xai-sdk>=1.11",
  "openai>=1.50",
  "httpx>=0.28",  # direct: bootstrap/xai_mgmt/stt; openai now pins httpx2, not httpx
  "loguru>=0.7",
  "pathspec>=0.12",
  "prompt_toolkit>=3",
  "rich>=13",
  "cryptography>=41",
  "keyring>=24",
  "pyyaml>=6",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0",   # FastMCP server for the Grok Build bridge (xlii mcp deep-contexts)
]
daemon = [
  # XMPP/OMEMO multi-machine fabric (xlii daemon). Live-verified 2026-07-15
  # against slixmpp 1.17 / slixmpp-omemo 2.2 (xmpp-next Part A). The code
  # targets the modern APIs: no XMLStream.process(), and encrypt_message's
  # single-stanza return — hence the >=2 floor on slixmpp-omemo.
  "slixmpp>=1.9",
  "slixmpp-omemo>=2",
  "qrcode>=7",  # optional pretty QR for `xlii pair`; ceremony works without it
]
tui = [
  "textual>=0.60",       # optional full-screen front-end: xlii code --tui (tui-layer T6)
  "textual-image>=0.7",  # true sixel/kitty/iterm image preview in the TUI transcript
]
web = [
  # `xlii serve` — the Textual TUI in a browser tab (proposals/serve-web.md W1).
  # Depends on the [tui] pins directly so `pip install "xlii[web]"` alone is
  # honest: serving without the TUI installed is meaningless.
  "textual-serve>=1.1",
  "textual>=0.60",
  "textual-image>=0.7",
]
files = [
  # Optional file handling for the upload locker (/upload, /locker).
  "pypdf>=4",          # PDF → text extraction (proposals/upload-locker.md U3)
  "tkinterdnd2>=0.4",  # real drag-and-drop in the /upload popup (the picker works without it)
]
remote = [
  # SFTP branch of the ftp:// remote-filesystem provider (proposals/remote-fs.md).
  # FTP/FTPS need nothing extra — they ride the stdlib ftplib.
  "paramiko>=3",
]
pdf = [
  # document-pdf: markdown→HTML→PDF (weasyprint best; fpdf2 pure-python fallback).
  "markdown>=3.5",
  "weasyprint>=62",
  "fpdf2>=2.7",
]
webdav = [
  # WebDAV branch of the dav:// remote-filesystem provider
  # (proposals/remote-backends.md, Vector W). A thin client over requests —
  # PROPFIND/GET/PUT/DELETE/MKCOL — no dedicated webdav library needed.
  "requests>=2.31",
]
smb = [
  # SMB/CIFS branch of the smb:// remote-filesystem provider
  # (proposals/remote-backends.md, Vector M) — NAS / Windows shares.
  "smbprotocol>=1.10",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.4",
  "pyftpdlib>=1.5",  # local throwaway FTP server for tests/test_remotefs.py (no network)
  "import-linter>=2",  # faces->kernel import contract (godzilla-mothra V0a); CI runs lint-imports
  # ~35 test modules importorskip("textual") and several import it at module
  # scope, so without the [tui] pins the whole TUI/panes/dock suite either skips
  # or fails to collect — silently, which is worse. Self-referencing the extra
  # keeps the pins in one place; textual itself pulls platformdirs and
  # markdown-it-py[linkify], and textual-image pulls pillow.
  # NOT added: [daemon] and [web]. tests/test_cli.py and tests/test_serve_web.py
  # assert the *friendly hint* shown when those extras are absent, so installing
  # them here would turn four passing tests into skips. They belong in a
  # full-extras CI leg, not in dev.
  "xlii[tui]",
]

[project.scripts]
xlii = "xlii.cli:main"

[project.urls]
Homepage = "https://xlii.computer"
Repository = "https://github.com/xlii-computer/xlii"

[tool.setuptools.packages.find]
where = ["."]
include = ["xlii*"]

[tool.setuptools.dynamic]
version = {attr = "xlii.__version__"}

[tool.setuptools.package-data]
"xlii.stock_plugins" = ["*.md"]
"xlii.tui" = ["*.nfo"]  # bundled default splash screen (xlii/tui/splash.nfo)
"xlii" = ["prompts/*.md", "help/**/*.yaml", "help/**/*.md", "selfwiki/**/*.md", "stock_roles/*.md", "stock_skills/**/*.md", "stock_personas/*.md", "face_assets/*.html", "face_assets/**/*.css", "face_assets/**/*.js", "face_assets/**/*.png", "face_assets/**/*.svg", "face_assets/**/*.toml", "face_assets/**/*.jpg", "face_assets/**/*.jpeg", "face_assets/**/*.webp", "face_assets/**/*.gif", "face_assets/**/*.woff2", "face_assets/**/*.webm", "face_assets/**/*.webmanifest", "provider_manifests/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
filterwarnings = [
  "ignore::DeprecationWarning:pathspec.*",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Start with the high-signal bug classes (syntax errors, undefined names,
# unused imports, redefinitions). Style rules can ratchet up later.
select = ["E9", "F"]

# ---------------------------------------------------------------------------
# Import contract (godzilla-mothra V0a): faces import kernel, NEVER the
# reverse. Faces = xlii.tui, xlii.panes, xlii.tui_textual; kernel = every
# other xlii module. The 22 remaining ignore_imports edges are the FROZEN
# Stage-0 baseline (exact, never wildcarded): no new entries ever; Stage 1
# burns the list down. The ONE edge beyond that baseline is the B1 face-deck
# seam (xlii.face_panes -> xlii.panes.dock): the browser face drives the SAME
# headless Dock the TUI projects rather than reimplementing the layout, and the
# whole seam is that one exact import — narrowed on purpose so Stage 1 can
# retire it by relocating the headless dock out of the face package.
# unmatched_ignore_imports_alerting=error keeps the baseline
# honest in both directions (a fixed edge must be deleted here in the same
# PR). scripts/check_contracts.py verifies source_modules stays in sync with
# the filesystem (including PEP 420 namespace-dir escapes grimp cannot see),
# so a NEW kernel module cannot dodge the contract.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["xlii"]

[[tool.importlinter.contracts]]
name = "faces import kernel, never the reverse"
type = "forbidden"
forbidden_modules = ["xlii.tui", "xlii.panes", "xlii.tui_textual"]
unmatched_ignore_imports_alerting = "error"
